# Full evaluation configuration for di_eval
# Complete dialogues across domains

dataset_mode: full
output_dir: outputs/di
timeout: 30

num_dialogues: 10  # Per condition (baseline + awareness)
turns_per_dialogue: 8

models:
  - name: gpt-4
    provider: openai
    model: gpt-4

  - name: claude-3-5-sonnet
    provider: anthropic
    model: claude-3-5-sonnet-20241022
