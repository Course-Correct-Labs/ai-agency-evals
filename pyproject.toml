[project]
name = "ai-agency-evals"
version = "0.1.0"
description = "Reproducible evaluation suite for three LLM behavior papers"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"
